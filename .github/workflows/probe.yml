name: CME probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node cme-probe.js
      - uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: probe-output.txt
