name: CME auto levels
on:
  schedule:
        - cron: "17 4 * * 1-5"     # 08:17 Mauritius, Mon–Fri
  workflow_dispatch:
    inputs:
      mode:
        description: "discover (run once first) or daily"
        default: "daily"
        type: choice
        options: [daily, discover]
permissions:
  contents: write
jobs:
  levels:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install databento pandas numpy yfinance requests
      - name: Run
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_COST: "3"
        run: |
          if [ "${{ github.event.inputs.mode }}" = "discover" ]; then python cme_auto.py --discover; else python cme_auto.py; fi
      - name: Save products.json / state.json
        if: always()
        run: |
          git config user.name "cme-bot"; git config user.email "bot@users.noreply.github.com"
          git add products.json state.json 2>/dev/null; git commit -m "bot: update state" && git push || echo "nothing to commit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levels
          path: levels.txt
